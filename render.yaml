services:
  # 1. Express REST API Backend connected to MongoDB Atlas
  - type: web
    name: campusfind-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5001
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set in Render dashboard to your free MongoDB Atlas connection URI
      - key: CLIENT_URL
        value: https://campusfind-app.onrender.com

  # 2. React Vite Client
  - type: static
    name: campusfind-app
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: campusfind-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
